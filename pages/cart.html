<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bag / SneakerShop</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body class="inner-page">
    <header class="site-header">
      <a class="brand" href="../index.html"
        ><span class="brand-mark">S</span><span>SNEAKERSHOP</span></a
      ><a class="bag-link" href="../index.html">Continue shopping ↗</a>
    </header>
    <main class="cart-page">
      <p class="eyebrow">YOUR EDIT</p>
      <h1>Shopping<br /><em>bag.</em></h1>
      <div class="cart-layout">
        <section id="cart-items">
          <div class="skeleton cart-skeleton"></div>
        </section>
        <aside class="cart-summary">
          <label class="city-choice"
            >Получить в городе
            <select id="checkout-city">
              <option value="almaty">Алматы</option>
              <option value="astana">Астана</option>
            </select></label
          >
          <p>Subtotal <strong id="cart-total">$0</strong></p>
          <p>Shipping <span>Рассчитаем при оформлении</span></p>
          <hr />
          <p class="summary-total">
            Total <strong id="cart-total-copy">$0</strong>
          </p>
          <button class="button button-dark" id="checkout">
            Checkout <span>↗</span>
          </button>
        </aside>
      </div>
    </main>
    <script type="module" src="../js/cart-page.js"></script>
  </body>
</html>
